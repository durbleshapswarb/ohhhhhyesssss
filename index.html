<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
	<link rel="icon" type="x-icon" href="favicon.png">
	<title>UNDERTALE</title>
    <style>
      @-webkit-keyframes rotation {
        from { -webkit-transform: rotate(0deg); }
        to { -webkit-transform: rotate(360deg); }
      }
      @-moz-keyframes rotation {
        from { -moz-transform: rotate(0deg); }
        to { -moz-transform: rotate(360deg); }
      }
      @-o-keyframes rotation {
        from { -o-transform: rotate(0deg); }
        to { -o-transform: rotate(360deg); }
      }
      @keyframes rotation {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      html { background: #FFFFFF; }

      body {
        font-family: arial;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        min-height: fill-available;
        min-height: 100vh;
        min-width: 100vw;
        background: radial-gradient(56.63% 56.63% at 50% 43.37%, transparent 0%, transparent 100%);
		background-color: black;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
		place-items: center;
      }

      body.scrollingDisabled { overflow: hidden; }

      .emscripten { padding-right: 0; display: block; }

      div.emscripten { text-align: center; font-family: "Lucida Console", Monaco, monospace; }

      canvas.emscripten {
        display: none;
        background-color: black;
        position: flex;
        transition: opacity 5s ease-in;
        -webkit-transition: opacity 5s ease-in;
        opacity: 0;
        filter: blur(0) grayscale(0);
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: -o-crisp-edges;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }

      canvas.active { animation-name: fadeIn; animation-duration: 2s; opacity: 1; }
      canvas.paused { animation-name: blur; animation-duration: 0.5s; filter: blur(2px) grayscale(1); }
      canvas.unpaused { animation-name: none; }
      canvas.animatedSizeTransitions { transition: width 0.3s ease, height 0.3s ease; }

      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes blur { 0% { filter: blur(0) grayscale(0); } 100% { filter: blur(2px) grayscale(1); } }

      .spinner {
        height: 30px; width: 30px;
        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }

      #status { display: inline-block; vertical-align: top; font-weight: bold; color: white; }

      #progress { width: 250px; height: 10px; -webkit-appearance: none; appearance: none; padding: 5px; }

      progress[value]::-webkit-progress-bar { background-color: #8492a6; height: 10px; border-radius: 15px; }
      progress[value]::-webkit-progress-value { background-image: -webkit-linear-gradient(left, #719900, #bdff00); height: 10px; border-radius: 15px; }

      div.loading {
        position: absolute; top: 0; bottom: 0; left: 0; right: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        pointer-events: none;
      }
      div.loading > * { padding: 10px; margin: 10px; }

      .output-container { text-align: center; margin-top: auto; }
      .output-button {
        border: none; width: 200px; height: 25px; margin: 5px; border-radius: 5px;
        cursor: pointer; background-color: black; color: white;
		outline-color: #20c20e; outline-style: dashed;
        font-family: "Lucida Console", Monaco, monospace;
      }

      #output {
        display: none; height: 200px; background-color: black; color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none; border: none; padding: 0; width: 100%;
      }

      #message-container {
        display: none; min-height: 50px; background-color: rgba(20, 20, 20, 0.5);
        outline: none; border: none; padding: 0; width: 100%; position: absolute; top: 0;
      }

      #messages { margin-left: 50px; color: white; font-family: "Lucida Console", Monaco, monospace; outline: none; border: none; padding: 0; }

      #pauseMenuContainer {
        position: absolute; top: 0; bottom: 0; left: 0; right: 0;
        display: flex; justify-content: center; align-items: center;
      }
      #pauseMenuContainer[hidden] { display: none !important; opacity: 0; }
      #pauseMenuBorder {
        background: linear-gradient(135deg, #FA1E4E, transparent 40%);
        padding: 1px; border-radius: 4px;
        clip-path: polygon(10.5px 0, 100% 0, 100% 100%, 0 100%, 0 10.5px);
        width: 70vw; max-width: 400px;
      }
      #pauseMenu {
        display: flex; flex-direction: column; padding: 60px 30px 60px 30px;
        background: linear-gradient(180deg, #2E273F 16.15%, rgba(46, 39, 63, 0.79) 56.25%, #2E273F 91.15%);
        border-radius: 4px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
        animation-name: fadeIn; animation-duration: 0.5s; opacity: 1;
      }
      #pauseMenu button {
        font-weight: 500; font-size: 17px; color: white; background: #FA1E4E;
        border: 1px solid #FA1E4E; border-radius: 6px; padding: 12px 24px; margin: 5px 0;
        -webkit-user-select: none; user-select: none;
      }
      #pauseMenu button#quitButton { background: #FA1E4E40; }
      #pauseMenu button:hover { filter: brightness(1.15); }
      #pauseMenu button:active { filter: brightness(0.85); }
      #pauseMenu button[hidden] { display: none; }

      /* Mobile touch controls */
      #touchControls { display: none; }
      @media (pointer: coarse), (max-width: 760px), (min-width: 761px) {
        body { min-width: 0; min-height: 100dvh; overscroll-behavior: none; touch-action: none; }
        #touchControls {
          position: fixed; inset: 0; z-index: 20; display: block;
          pointer-events: none; user-select: none; -webkit-user-select: none;
        }
        .control-pad {
          position: absolute; top: 50%; bottom: auto;
          width: min(clamp(190px, 48vw, 280px), 58dvh); height: min(clamp(190px, 48vw, 280px), 58dvh);
          border: 0; border-radius: 50%;
          background: radial-gradient(circle, rgba(115,115,115,.72) 0 34%, transparent 34.5%);
          box-shadow: none; pointer-events: auto; touch-action: none;
        }
        #joystick { left: max(0px, env(safe-area-inset-left)); transform: translate(-14%, -50%); }
        #stick {
          position: absolute; left: 50%; top: 50%; width: 38%; height: 38%;
          transform: translate(-50%,-50%); border-radius: 50%; border: 0;
          background: rgba(190,190,190,.42); box-shadow: none; pointer-events: none;
        }
        .pad-mark { display:none; }
        #actionButtons {
          position:absolute; right:max(12px, env(safe-area-inset-right));
          top:50%; bottom:auto; transform:translateY(-50%);
          width:clamp(64px, 17vw, 92px); height:min(clamp(220px, 52vw, 270px), 74dvh); pointer-events:none;
        }
        .action-button {
          position:absolute; right:0; width:clamp(58px, 16vw, 82px); height:clamp(58px, 16vw, 82px);
          border-radius:50%; border:0; color:white; font:bold 22px Arial;
          text-shadow:none; box-shadow:none; pointer-events:auto; touch-action:none; -webkit-tap-highlight-color:transparent;
        }
        #buttonC { top:0; background:#302b50; }
        #buttonX { top:50%; transform:translateY(-50%); background:#302b50; }
        #buttonZ { bottom:0; background:#302b50; }
        .action-button.is-pressed { filter:brightness(1.35); transform:scale(.94); }
        #buttonX.is-pressed { transform:translateY(-50%) scale(.94); }
        #keyboardButton {
          position:absolute; top:-34px; right:8px; width:27px; height:27px;
          border:0; border-radius:6px; padding:0; color:#fff; background:#302b50;
          font:16px Arial; line-height:27px; text-align:center; pointer-events:auto; touch-action:manipulation;
        }
        #keyboardInput {
          position:fixed; left:50%; bottom:0; width:2px; height:2px; padding:0;
          border:0; opacity:.01; font-size:16px; z-index:-1;
        }
        canvas.emscripten { touch-action:none; }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        .control-pad { width: min(46vh, 220px); height:min(46vh, 220px); }
        #actionButtons { height:min(66vh,240px); width:75px; }
        .action-button { width:min(16vh,62px); height:min(16vh,62px); font-size:18px; }
      }

    <script>
      (() => {
        const pad = document.getElementById('joystick');
        const stick = document.getElementById('stick');
        const keyboardButton = document.getElementById('keyboardButton');
        const keyboardInput = document.getElementById('keyboardInput');
        const held = new Set();
        let outsidePointerId = null;
        const keyMap = { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight' };
        const keyCodes = { ArrowLeft:37, ArrowUp:38, ArrowRight:39, ArrowDown:40, z:90, x:88, c:67 };
        
        function setKey(key, on) {
          if (on && !held.has(key)) {
            held.add(key);
            dispatchKeyboardEvent('keydown', key);
          } else if (!on && held.has(key)) {
            held.delete(key);
            dispatchKeyboardEvent('keyup', key);
          }
        }
        
        function dispatchKeyboardEvent(type, key) {
          const target = document.getElementById('canvas') || document;
          const code = keyCodes[key] || 0;
          const event = new KeyboardEvent(type, {
            key, code: key.startsWith('Arrow') ? key : `Key${key.toUpperCase()}`,
            bubbles: true, cancelable: true, composed: true,
            keyCode: code, which: code, charCode: type === 'keypress' ? code : 0
          });
          try {
            Object.defineProperty(event, 'keyCode', { get: () => code });
            Object.defineProperty(event, 'which', { get: () => code });
          } catch (_) {}
          target.dispatchEvent(event);
        }
        
        keyboardButton.addEventListener('pointerdown', event => event.stopPropagation());
        keyboardButton.addEventListener('click', () => {
          if (document.activeElement === keyboardInput) keyboardInput.blur();
          else keyboardInput.focus({preventScroll:true});
        });
        
        keyboardInput.addEventListener('keydown', event => {
          if (event.key === 'Process' || event.key === 'Dead' || event.isComposing) return;
          event.preventDefault();
          if (event.key.startsWith('Arrow') || event.key.length === 1) {
            const key = event.key.startsWith('Arrow') ? event.key : event.key.toLowerCase();
            setKey(key, true);
          }
        });
        keyboardInput.addEventListener('keyup', event => {
          const key = event.key.startsWith('Arrow') ? event.key : event.key.toLowerCase();
          setKey(key, false);
        });
        keyboardInput.addEventListener('blur', () => {
          held.forEach(key => setKey(key, false));
        });
        
        function updatePad(event) {
          const r = pad.getBoundingClientRect();
          const cx = r.left + r.width/2, cy = r.top + r.height/2;
          let dx = event.clientX-cx, dy=event.clientY-cy;
          const max = r.width*.18, len=Math.hypot(dx,dy);
          if (len > max) { dx=dx/len*max; dy=dy/len*max; }
          stick.style.left = `calc(50% + ${dx}px)`;
          stick.style.top = `calc(50% + ${dy}px)`;
          const nx=(event.clientX-cx)/(r.width*.43), ny=(event.clientY-cy)/(r.height*.43);
          const distance=Math.hypot(nx,ny), ax=Math.abs(nx), ay=Math.abs(ny);
          const cardinalBias=1.45;
          const horizontal=ax > ay*cardinalBias, vertical=ay > ax*cardinalBias;
          const diagonal=!horizontal && !vertical && distance>.14;
          const active=distance>.14;
          setKey(keyMap.left, active && nx<0 && (horizontal || diagonal));
          setKey(keyMap.right, active && nx>0 && (horizontal || diagonal));
          setKey(keyMap.up, active && ny<0 && (vertical || diagonal));
          setKey(keyMap.down, active && ny>0 && (vertical || diagonal));
        }
        
        function releasePad() {
          Object.values(keyMap).forEach(k=>setKey(k,false));
          stick.style.left='50%'; stick.style.top='50%';
        }
        
        pad.addEventListener('pointerdown', e=>{ e.preventDefault(); const gameCanvas=document.getElementById('canvas'); if(gameCanvas) gameCanvas.focus({preventScroll:true}); pad.setPointerCapture(e.pointerId); updatePad(e); });
        pad.addEventListener('pointermove', e=>{ if (pad.hasPointerCapture(e.pointerId)) updatePad(e); });
        ['pointerup','pointercancel','lostpointercapture'].forEach(type=>pad.addEventListener(type,releasePad));
        
        window.addEventListener('pointerdown', e=>{
          if (e.clientX >= window.innerWidth * .5 || e.target.closest('#actionButtons')) return;
          const canvas=document.getElementById('canvas');
          if (canvas) {
            const r=canvas.getBoundingClientRect();
            if (e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom) return;
          }
          if (pad.contains(e.target)) return;
          e.preventDefault(); outsidePointerId=e.pointerId;
          if (canvas) canvas.focus({preventScroll:true});
          updatePad(e);
        }, {capture:true,passive:false});
        
        window.addEventListener('pointermove',e=>{
          if (e.pointerId===outsidePointerId) { e.preventDefault(); updatePad(e); }
        }, {capture:true,passive:false});
        
        const finishOutsidePointer=e=>{
          if (e.pointerId===outsidePointerId) { outsidePointerId=null; releasePad(); }
        };
        window.addEventListener('pointerup',finishOutsidePointer,true);
        window.addEventListener('pointercancel',finishOutsidePointer,true);
        
        document.querySelectorAll('.action-button').forEach(button=>{
          const key=button.textContent.trim().toLowerCase();
          button.addEventListener('pointerdown',e=>{e.preventDefault();const gameCanvas=document.getElementById('canvas');if(gameCanvas)gameCanvas.focus({preventScroll:true});button.setPointerCapture(e.pointerId);button.classList.add('is-pressed');setKey(key,true);});
          const up=()=>{button.classList.remove('is-pressed');setKey(key,false);};
          ['pointerup','pointercancel','lostpointercapture'].forEach(type=>button.addEventListener(type,up));
          button.addEventListener('contextmenu',e=>e.preventDefault());
        });
        window.addEventListener('blur',()=>{releasePad();['z','x','c'].forEach(k=>setKey(k,false));});
      })();
    </script>

    <script type="text/javascript">
    // --- START OF MULTI-PART STITCHING SYSTEM ---
    (function() {
      const totalParts = 7;
      let cachedBlobUrl = null;
      let fetchPromise = null;

      async function getCombinedGameUnx(originalUrl) {
        if (cachedBlobUrl) return cachedBlobUrl;
        if (!fetchPromise) {
          fetchPromise = (async () => {
            const buffers = [];
            // Download parts ONE BY ONE to save mobile RAM
            for (let i = 1; i <= totalParts; i++) {
              document.getElementById('status').innerText = `Downloading part ${i} of ${totalParts}...`;
              const res = await fetch(`${originalUrl}.part${i}`);
              if (!res.ok) throw new Error(`Could not load part ${i}`);
              const buffer = await res.arrayBuffer();
              buffers.push(buffer);
            }
            
            document.getElementById('status').innerText = `Stitching files...`;
            
            // Stitch segments into a combined object binary
            const combinedBlob = new Blob(buffers, { type: 'application/octet-stream' });
            cachedBlobUrl = URL.createObjectURL(combinedBlob);
            return cachedBlobUrl;
          })();
        }
        return fetchPromise;
      }

      // Intercept fetch API calls
      const nativeFetch = window.fetch;
      window.fetch = async function(resource, options) {
        const url = typeof resource === 'string' ? resource : resource.url;
        if (url && url.endsWith('game.unx')) {
          try {
            const stitchedUrl = await getCombinedGameUnx(url);
            return nativeFetch(stitchedUrl, options);
          } catch (e) {
            console.error("Stitching error during Fetch:", e);
          }
        }
        return nativeFetch.apply(this, arguments);
      };

      // Intercept older XMLHttpRequest calls
      const nativeOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        if (typeof url === 'string' && url.endsWith('game.unx')) {
          this._isGameUnx = true;
          this._gameUnxUrl = url;
        }
        return nativeOpen.apply(this, [method, url, ...args]);
      };

      const nativeSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function(...args) {
        if (this._isGameUnx) {
          getCombinedGameUnx(this._gameUnxUrl).then(stitchedUrl => {
            nativeOpen.apply(this, ['GET', stitchedUrl, true]);
            nativeSend.apply(this, args);
          }).catch(e => {
            console.error("Stitching error during XHR:", e);
            nativeSend.apply(this, args);
          });
          return;
        }
        return nativeSend.apply(this, args);
      };
    })();
    // --- END OF MULTI-PART STITCHING SYSTEM ---

	function changecolor(el) { document.body.style.backgroundColor = el.value; }
	
      const CHANGE_ASPECT_RATIO = true;
      var bodyElement = document.getElementsByTagName("body")[0];
      var statusElement = document.getElementById("status");
      var progressElement = document.getElementById("progress");
      var spinnerElement = document.getElementById("spinner");
      var canvasElement = document.getElementById("canvas");

      var qrElement = document.getElementById("QRCode");
      var qr2Element = document.getElementById("QR2Code");
      var qrButton = document.getElementById("QRButton");
      var qr2Button = document.getElementById("QR2Button");
      var pauseMenu = document.getElementById("pauseMenuContainer");

      const messageContainerElement = document.getElementById("message-container");

      let rollbackMessages = [];
	  
	  const CONSOLE_layer_set_visible = "layer_set_visible() - could not find specified layer in current room";
	  const CONSOLE_layer_tilemap_get_id = "layer_tilemap_get_id() - specified tilemap not found";
	  const CONSOLE_layer_depth = "layer_depth() - can't find specified layer";
	  const CONSOLE_draw_tilemap = "draw_tilemap() - couldn't find specified tilemap";
	  const CONSOLE_layer_get_all_elements = "layer_get_all_elements() - can't find specified layer";
	  
	  console.log("*************************");

      let clearRollbackMessagesTimeoutId = -1;
      const showRollbackMessage = function (message) {
        let messages = "";
        rollbackMessages.push(message);
        rollbackMessages.forEach(m => messages += "<p>" + m + "</p>");
        messagesElement.innerHTML = messages;
        messageContainerElement.style.display = 'block';
        if (clearRollbackMessagesTimeoutId === -1) { clearTimeout(clearRollbackMessagesTimeoutId); }
        clearRollbackMessagesTimeoutId = setTimeout(clearRollbackMessages, 5000);
      };

      const clearRollbackMessages = function () {
        clearRollbackMessagesTimeoutId = -1;
        rollbackMessages = [];
        messageContainerElement.style.display = 'none';
      };
		
	  var loadprogress = 0;
      var startingHeight, startingWidth;
      var startingAspect;
      
      var Module = {
        preRun: [],
        postRun: [],
        print: (function () {
          var element = document.getElementById("output");
          if (element) element.value = ""; 
          return function (text) {
			if (text === "Starting WAD") { loadprogress += 1; }
			if (loadprogress === 1) { Module.setStatus(text); }
			else if (loadprogress >= 2) { Module.setStatus(""); }
			
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
			
			if (text != CONSOLE_layer_set_visible && text != CONSOLE_layer_tilemap_get_id && text != CONSOLE_layer_depth && text != CONSOLE_draw_tilemap && text != CONSOLE_layer_get_all_elements) { console.log(text); }
            
            if (text === "Entering main loop.") {
              ensureAspectRatio();
			  loadprogress += 1;
            }
            if (element) {
				if (text != CONSOLE_layer_set_visible && text != CONSOLE_layer_tilemap_get_id && text != CONSOLE_layer_depth && text != CONSOLE_draw_tilemap && text != CONSOLE_layer_get_all_elements) { element.value += text + "\n"; }
				element.scrollTop = element.scrollHeight;
            }
          };
        })(),
        printErr: function (text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
          console.error(text);
        },
        canvas: (function () { return document.getElementById("canvas"); })(),
        setStatus: function (text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: "" };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) * 100;
            progressElement.max = parseInt(m[4]) * 100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;

      function ensureAspectRatio() {
        if (canvasElement === undefined) { return; }
        if (!CHANGE_ASPECT_RATIO) { return; }
        if (startingHeight === undefined && startingWidth === undefined) { return; }

        canvasElement.classList.add("active");

        const maxWidth = window.innerWidth;
        const maxHeight = window.innerHeight;
        var newHeight, newWidth;

        var heightQuotient = startingHeight / maxHeight;
        var widthQuotient = startingWidth / maxWidth;

        if (heightQuotient > widthQuotient) {
          newHeight = maxHeight;
          newWidth = newHeight * startingAspect;
        } else {
          newWidth = maxWidth;
          newHeight = newWidth / startingAspect;
        }

        canvasElement.style.height = newHeight + "px";
        canvasElement.style.width = newWidth + "px";
      }
